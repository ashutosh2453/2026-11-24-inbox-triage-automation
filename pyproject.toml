[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-triage"
version = "0.1.0"
description = "Local-first inbox triage over IMAP: explainable phishing detection, retrainable classifier, priorities, action items, SQLite and an optional local LLM"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.setuptools.package-data]
"triage.data" = ["*.jsonl"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]
